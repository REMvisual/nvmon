        font-family="'Inter','Segoe UI',system-ui,-apple-system,'Roboto','Helvetica Neue',Arial,sans-serif"
        font-weight="800" font-size="180" letter-spacing="-6" fill="#0A0A12">nvmon</text>

  <text x="348" y="253"
        font-family="'Inter','Segoe UI',system-ui,-apple-system,'Roboto',sans-serif"
        font-weight="600" font-size="19" letter-spacing="4" fill="#4B5563">NVIDIA · RENDER-FLEET MONITORING · CONTROL</text>

  <g transform="translate(1430, 55)">
    <rect x="0" y="0" width="120" height="40" rx="20"
          fill="#22C55E" fill-opacity="0.14"
          stroke="#15803D" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="22" cy="20" r="6" fill="#15803D"/>
    <text x="40" y="27"
          font-family="'Inter','Segoe UI',system-ui,sans-serif"
          font-weight="700" font-size="17" letter-spacing="2.5" fill="#15803D">LIVE</text>
  </g>

  <line x1="60" y1="290" x2="1540" y2="290" stroke="#0A0A12" stroke-opacity="0.10" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- BOTTOM ROW — dashboard                                        -->
  <!-- ============================================================ -->

  <text x="80" y="335"
        font-family="'Inter','Segoe UI',system-ui,sans-serif"
        font-weight="700" font-size="17" letter-spacing="4.5" fill="#4A90E2">FLEET</text>

  <text x="830" y="335"
        font-family="'Inter','Segoe UI',system-ui,sans-serif"
        font-weight="700" font-size="17" letter-spacing="4.5" fill="#0F9B8E">GPU&#160;TELEMETRY</text>

  <line x1="800" y1="310" x2="800" y2="500" stroke="#0A0A12" stroke-opacity="0.10" stroke-width="1"/>

