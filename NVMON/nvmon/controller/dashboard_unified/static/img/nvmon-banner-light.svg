        stroke="#0F9B8E" stroke-width="1.8" stroke-opacity="0.45" stroke-dasharray="6,8"/>

  <g stroke-linejoin="round">
    <g transform="translate(105, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(169, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(233, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(297, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(361, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(425, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(489, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="#4A90E2" stroke-width="2.2" stroke-opacity="0.4"/></g>
    <g transform="translate(553, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(617, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(681, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
    <g transform="translate(745, 415)"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#4A90E2" fill-opacity="0.18" stroke="#4A90E2" stroke-width="2.2"/><circle r="6" fill="#0F9B8E"/></g>
  </g>

  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" fill="#4B5563">
    <text x="80" y="490">
      <tspan fill="#0A0A12" font-weight="700">10/11</tspan>
      <tspan dx="8">ONLINE</tspan>
      <tspan dx="20" fill="#9CA3AF">·</tspan>
      <tspan dx="20" fill="#0A0A12" font-weight="700">22</tspan>
      <tspan dx="8">GPU</tspan>
      <tspan dx="20" fill="#9CA3AF">·</tspan>
      <tspan dx="20" fill="#0A0A12" font-weight="700">60</tspan>
      <tspan dx="8">HZ&#160;SYNC</tspan>
    </text>
  </g>

  <!-- TELEMETRY cell -->
  <g transform="translate(830, 360)">
    <line x1="0" y1="0"  x2="700" y2="0"  stroke="#0A0A12" stroke-opacity="0.06"/>
    <line x1="0" y1="47" x2="700" y2="47" stroke="#0A0A12" stroke-opacity="0.04"/>
    <line x1="0" y1="95" x2="700" y2="95" stroke="#0A0A12" stroke-opacity="0.06"/>

    <path d="M 0,78 L 50,68 L 100,73 L 155,52 L 210,60 L 270,38 L 325,46 L 380,24 L 430,32 L 490,16 L 545,26 L 600,20 L 655,28 L 700,22 L 700,95 L 0,95 Z"
          fill="url(#sparkFill)"/>

    <polyline points="0,78 50,68 100,73 155,52 210,60 270,38 325,46 380,24 430,32 490,16 545,26 600,20 655,28 700,22"
              fill="none" stroke="#0F9B8E" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="700" cy="22" r="11" fill="#0F9B8E" fill-opacity="0.25"/>
    <circle cx="700" cy="22" r="6"  fill="#0F9B8E"/>
  </g>

  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" fill="#4B5563">
    <text x="830" y="490">
      <tspan fill="#0A0A12" font-weight="700">36–84</tspan>°C
      <tspan dx="20" fill="#9CA3AF">·</tspan>
      <tspan dx="20" fill="#0A0A12" font-weight="700">1.2</tspan>
      <tspan dx="8">KW</tspan>
      <tspan dx="20" fill="#9CA3AF">·</tspan>
      <tspan dx="20" fill="#0A0A12" font-weight="700">68</tspan>%
      <tspan dx="8">UTIL</tspan>
    </text>
  </g>

  <rect x="0" y="535" width="1600" height="5" fill="url(#accent)" opacity="0.65"/>
