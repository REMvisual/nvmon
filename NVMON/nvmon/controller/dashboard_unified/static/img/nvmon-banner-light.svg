<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540"
     role="img" aria-label="nvmon — NVIDIA render-fleet monitoring and control">
  <title>nvmon — NVIDIA render-fleet monitoring and control</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#0F9B8E"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0F9B8E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F9B8E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#0A0A12" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="5" fill="url(#accent)"/>

  <!-- ============================================================ -->
  <!-- TOP ROW — hero                                                -->
  <!-- ============================================================ -->

  <g transform="translate(80, 45) scale(1.25)">
    <polygon points="90,28 144,59 144,121 90,152 36,121 36,59"
             fill="none" stroke="#4A90E2" stroke-width="4" stroke-linejoin="round"/>
    <g fill="none" stroke="#4A90E2" stroke-width="2.2" stroke-linejoin="round">
      <path d="M 90 90 L 71 45 L 49 63 Z"/>
      <path d="M 90 90 L 43 76 L 43 104 Z"/>
      <path d="M 90 90 L 71 135 L 49 117 Z"/>
    </g>
    <g stroke="#0F9B8E" stroke-width="1.6" stroke-linecap="round">
      <line x1="67" y1="69" x2="67" y2="65"/>
      <line x1="69" y1="69" x2="69" y2="62"/>
      <line x1="71" y1="69" x2="71" y2="64"/>
      <line x1="73" y1="69" x2="73" y2="63"/>
    </g>
    <g fill="none" stroke="#0F9B8E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 55.5 92 A 3.5 3.5 0 0 1 62.5 92"/>
      <line x1="59" y1="92" x2="61" y2="89"/>
    </g>
    <circle cx="59" cy="92" r="1.5" fill="#0F9B8E"/>
    <g stroke="#0F9B8E" stroke-width="1.2" stroke-linecap="round">
      <line x1="67" y1="112" x2="73" y2="112"/>
      <line x1="67" y1="112" x2="70" y2="117"/>
      <line x1="73" y1="112" x2="70" y2="117"/>
    </g>
    <g fill="#0F9B8E">
      <circle cx="67" cy="112" r="1.5"/>
      <circle cx="73" cy="112" r="1.5"/>
      <circle cx="70" cy="117" r="1.5"/>
